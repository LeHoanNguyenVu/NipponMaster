# Production Profile Configuration
logging.level.com.nihongo.api=INFO
logging.level.org.springframework.security=WARN

# Disable SQL logging for performance
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# Disable Swagger/OpenAPI for security in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Bắt buộc cấu hình JWT_SECRET từ biến môi trường trên Production (không cho phép fallback khóa mặc định)
jwt.secret=${JWT_SECRET}
server.forward-headers-strategy=framework
