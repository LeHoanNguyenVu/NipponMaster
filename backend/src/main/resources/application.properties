# ============================================
# NihongoAPI - Cấu hình ứng dụng
# ============================================

spring.application.name=NihongoAPI
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Server ---
server.port=8088
server.servlet.context-path=/

# --- PostgreSQL Database ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nihongo_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Logging Optimization ---
logging.level.root=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.springframework.security=INFO
logging.level.com.nihongo.api=INFO

# --- Flyway Database Migration ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# --- Jackson (JSON) ---
# Cấu hình Jackson được xử lý trong JacksonConfig.java

# --- API Keys ---
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-flash-lite-latest
# google.translate.api.key=your_google_translate_key

# --- JWT ---
jwt.secret=${JWT_SECRET:9a4f2c8d7e1b5a3f6c8e0d2b4a6f8c1d3e5b7a9f2c4d6e8b0a2c4f6e8d0a2b4c}
jwt.expiration-ms=86400000

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms

# --- Stripe Payment Gateway ---
stripe.api.key=${STRIPE_API_KEY:sk_test_placeholder}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

# --- Supabase Storage ---
supabase.url=${SUPABASE_URL:https://bxqwarbeocbsfjieqbsq.supabase.co}
supabase.key=${SUPABASE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:kanji-assets}

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# --- Reading Room (Luyện Đọc Báo Nhật) ---
reading.ingest.enabled=false
reading.ingest.cron=0 0 6 * * *
reading.ingest.max-events-per-run=5
reading.ingest.target-levels=N5,N3,N1
reading.rss.enabled-sources=GOV_ONLINE,DIGITAL_AGENCY,KANKOCHO,MAFF,NHK_TOP,NHK_CULTURE,NHK_ECONOMY,NHK_SCITECH
reading.copyright.max-8gram-overlap=0.10
reading.level.vocab-coverage=0.84
reading.level.kanji-coverage=0.84
reading.level.sent-len-n5=22
reading.level.sent-len-n4=30
reading.level.sent-len-n3=41
reading.level.sent-len-n2=53
reading.level.llm-second-opinion-enabled=true
reading.audio.bucket=reading-audio
reading.audio.tts-model=gemini-2.5-flash-preview-tts
reading.image.gemini-api-key=${GEMINI_MEDIA_API_KEY:}
reading.image.gemini-model=gemini-2.5-flash-image
reading.image.bucket=${READING_IMAGE_BUCKET:${supabase.storage.bucket:kanji-assets}}
reading.image.pexels-api-key=${PEXELS_API_KEY:}
reading.retention.days=7
reading.retention.cleanup-enabled=true


