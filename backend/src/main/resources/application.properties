# ============================================
# NihongoAPI - Cấu hình ứng dụng
# ============================================

spring.application.name=NihongoAPI

# --- Server ---
server.port=8080
server.servlet.context-path=/

# --- PostgreSQL Database ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Jackson (JSON) ---
# Cấu hình Jackson được xử lý trong JacksonConfig.java

# --- Logging ---
logging.level.com.nihongo.api=DEBUG
logging.level.org.springframework.security=DEBUG

# --- API Keys (để trống, cấu hình khi tích hợp) ---
# gemini.api.key=your_gemini_api_key
# google.translate.api.key=your_google_translate_key

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
